name: Download v86 Web Version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-v86:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official v86 web files
        run: |
          set -e

          mkdir -p v86/bios

          # Get the latest release tag
          TAG=$(curl -fsSL https://api.github.com/repos/copy/v86/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")

          echo "v86 release: $TAG"

          # Download the prebuilt JavaScript
          curl -fL \
            "https://github.com/copy/v86/releases/download/$TAG/libv86.js" \
            -o v86/libv86.js

          # Download the prebuilt WASM
          curl -fL \
            "https://github.com/copy/v86/releases/download/$TAG/v86.wasm" \
            -o v86/v86.wasm

          # Download BIOS files directly from v86
          curl -fL \
            "https://raw.githubusercontent.com/copy/v86/master/bios/seabios.bin" \
            -o v86/bios/seabios.bin

          curl -fL \
            "https://raw.githubusercontent.com/copy/v86/master/bios/vgabios.bin" \
            -o v86/bios/vgabios.bin

      - name: Verify
        run: |
          echo "===== v86 ====="
          ls -lh v86/

          echo "===== BIOS ====="
          ls -lh v86/bios/

          test -s v86/libv86.js
          test -s v86/v86.wasm
          test -s v86/bios/seabios.bin
          test -s v86/bios/vgabios.bin

          echo "SUCCESS: v86 web version downloaded!"

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v86/

          if git diff --cached --quiet; then
            echo "v86 is already installed."
          else
            git commit -m "Add v86 web emulator"
            git push
          fi
