name: Get v86

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-v86:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ZipperOS
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            nasm \
            python3 \
            python3-pip \
            nodejs \
            npm \
            rustc \
            cargo

      - name: Clone v86
        run: |
          git clone --depth 1 https://github.com/copy/v86.git /tmp/v86
          cd /tmp/v86

      - name: Install v86 dependencies
        working-directory: /tmp/v86
        run: |
          npm install

      - name: Build v86
        working-directory: /tmp/v86
        run: |
          make build/libv86.js
          make build/v86.wasm

      - name: Create ZipperOS v86 folder
        run: |
          mkdir -p v86/bios

      - name: Copy v86
        run: |
          cp /tmp/v86/build/libv86.js v86/libv86.js
          cp /tmp/v86/build/v86.wasm v86/v86.wasm

      - name: Copy BIOS
        run: |
          cp /tmp/v86/bios/seabios.bin v86/bios/seabios.bin
          cp /tmp/v86/bios/vgabios.bin v86/bios/vgabios.bin

      - name: Verify
        run: |
          echo "===== v86 ====="
          ls -lh v86/

          echo "===== BIOS ====="
          ls -lh v86/bios/

          test -s v86/libv86.js
          test -s v86/v86.wasm
          test -s v86/bios/seabios.bin
          test -s v86/bios/vgabios.bin

          echo "v86 installed successfully!"

      - name: Commit to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v86/

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Add v86 emulator"
            git push
          fi
