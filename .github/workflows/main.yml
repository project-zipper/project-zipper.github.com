name: Get v86

on:
workflow_dispatch:

permissions:
contents: write

jobs:
get-v86:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Download v86
    run: |
      mkdir -p v86/bios

      curl -L \
        https://github.com/copy/v86/releases/latest/download/libv86.js \
        -o v86/libv86.js

      curl -L \
        https://github.com/copy/v86/releases/latest/download/v86.wasm \
        -o v86/v86.wasm

  - name: Download BIOS
    run: |
      curl -L \
        https://raw.githubusercontent.com/copy/v86/master/bios/seabios.bin \
        -o v86/bios/seabios.bin

      curl -L \
        https://raw.githubusercontent.com/copy/v86/master/bios/vgabios.bin \
        -o v86/bios/vgabios.bin

  - name: Verify files
    run: |
      echo "v86 files:"
      ls -lh v86/
      echo ""
      echo "BIOS files:"
      ls -lh v86/bios/

      test -s v86/libv86.js
      test -s v86/v86.wasm
      test -s v86/bios/seabios.bin
      test -s v86/bios/vgabios.bin

  - name: Commit v86
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add v86/

      if git diff --cached --quiet; then
        echo "v86 is already up to date."
      else
        git commit -m "Add v86 emulator"
        git push
      fi
```
