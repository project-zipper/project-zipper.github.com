name: Get v86

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v86:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get v86
        run: |
          git clone --depth 1 https://github.com/copy/v86.git v86-source

      - name: Build v86
        run: |
          cd v86-source

          make build/libv86.js build/v86.wasm

      - name: Create v86 folders
        run: |
          mkdir -p v86/bios

      - name: Copy v86 browser files
        run: |
          cp v86-source/build/libv86.js v86/libv86.js
          cp v86-source/build/v86.wasm v86/v86.wasm

      - name: Copy BIOS files
        run: |
          cp v86-source/bios/seabios.bin v86/bios/seabios.bin
          cp v86-source/bios/vgabios.bin v86/bios/vgabios.bin

      - name: Remove source
        run: |
          rm -rf v86-source

      - name: Commit v86
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v86/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add v86 browser emulator"
            git push
          fi
