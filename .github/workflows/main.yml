name: Get v86

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-v86:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download v86
        run: |
          set -e

          mkdir -p v86/bios

          git clone --depth 1 https://github.com/copy/v86.git /tmp/v86

          cp /tmp/v86/build/libv86.js v86/libv86.js
          cp /tmp/v86/build/v86.wasm v86/v86.wasm
          cp /tmp/v86/bios/seabios.bin v86/bios/seabios.bin
          cp /tmp/v86/bios/vgabios.bin v86/bios/vgabios.bin

      - name: Verify v86
        run: |
          test -f v86/libv86.js
          test -f v86/v86.wasm
          test -f v86/bios/seabios.bin
          test -f v86/bios/vgabios.bin

          echo "v86 successfully installed:"
          find v86 -type f -printf '%p %s bytes\n'

      - name: Commit v86
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v86

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Add v86 emulator"
            git push
          fi
