<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZipperOS Versions</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>
    <div class="background-grid"></div>

    <main class="version-page">

        <div class="hero-badge">
            ZIPPEROS • VERSIONS
        </div>

        <img
            src="logo.png"
            alt="ZipperOS Logo"
            class="main-logo"
        >

        <h1>
            Supported <span>Versions</span>
        </h1>

        <p class="hero-subtitle">
            Current ZipperOS releases and their support periods.
        </p>

        <div class="version-grid">

            <div class="version-card glass-card">
                <div class="version-number">65</div>

                <div>
                    <div class="version-name">Acorn</div>
                    <div class="version-status">SUPPORTED</div>
                </div>

                <p>
                    Supported until ZipperOS V2 comes out.
                </p>
            </div>


            <div class="version-card glass-card">
                <div class="version-number">2</div>

                <div>
                    <div class="version-name">Banana</div>
                    <div class="version-status">SUPPORTED</div>
                </div>

                <p>
                    Supported till 2030.
                </p>
            </div>

        </div>

        <a
            href="index.html"
            class="btn btn-secondary back-button"
        >
            GO BACK
        </a>

    </main>

</body>
</html>
